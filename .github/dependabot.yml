# Each week: one pull request for the workflows' actions, one for the Python packages `pyproject.toml` names, and one
# each for google-adk and litellm, which move only with a live measurement on both arms. Every release waits three
# days, the span `[tool.uv]` gives the lock.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      python:
        patterns: ["*"]
        exclude-patterns: ["google-adk", "litellm"]
    ignore:
      # ADK caps litellm below 1.106.3, and 1.110.0 removed the names the login imports. Lift this with a measured
      # upgrade that rewrites the login, then look again at `requires-python`'s bound below 3.15.
      - dependency-name: "litellm"
        versions: [">=1.106.3"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
