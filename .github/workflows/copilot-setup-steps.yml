# The environment GitHub Copilot's cloud agent works in: the locked packages installed, so it can run the gate
# (`ruff`, `pyrefly`, `pytest`) from its first step. No key or login is set: the suite calls no model.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Copilot runs only the job of this name, and reads only its steps, permissions, runs-on, services, snapshot and
  # timeout-minutes.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Pinned by commit as in ci.yml, and kept in step with it by Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked
